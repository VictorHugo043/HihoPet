<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; media-src 'self' blob:; object-src 'none'; base-uri 'none'">
  <title>跟着音乐动 · Hiho</title>
  <link rel="stylesheet" href="music.css">
</head>
<body>
  <div class="snow">❄</div>
  <h1>一起听歌，ho！</h1>
  <p id="status" role="status">开启后，Hiho 会跟着系统播放的声音轻轻摇摆。只在本机分析，不保存或上传音频，不使用麦克风。</p>
  <button id="start">开始聆听</button>
  <p class="note">系统可能会请求音频权限。播放停止后，Hiho 会慢慢安静下来；右键可随时停止聆听。</p>
  <script type="module" src="music.js"></script>
</body>
</html>
